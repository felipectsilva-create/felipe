<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felipe Costa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap');
      
        *{
          margin:0;
          padding:0;
          box-sizing:border-box;
        }
      
        :root{
          --neon-green:#00ff88;
          --neon-blue:#00c3ff;
          --neon-yellow:#ffe600;
          --dark:#050816;
          --dark-2:#0a1024;
          --white:#ffffff;
        }
      
        body{
          min-height:100vh;
          font-family:'Poppins', sans-serif;
          overflow-x:hidden;
      
          background:
            radial-gradient(circle at top left, rgba(0,255,136,0.15), transparent 30%),
            radial-gradient(circle at bottom right, rgba(0,195,255,0.18), transparent 35%),
            linear-gradient(135deg, #050816, #0d1b3d);
      
          color:var(--white);
          position:relative;
        }
      
        /* GRID FUTURISTA */
        body::before{
          content:'';
          position:fixed;
          inset:0;
      
          background-image:
            linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      
          background-size:40px 40px;
      
          z-index:-1;
          animation:gridMove 10s linear infinite;
        }
      
        @keyframes gridMove{
          from{
            transform:translateY(0);
          }
      
          to{
            transform:translateY(40px);
          }
        }
      
        /* NAVBAR */
        nav{
          width:100%;
          position:fixed;
          top:0;
          left:0;
          z-index:1000;
      
          padding:20px 60px;
      
          background:rgba(5,8,22,0.55);
          backdrop-filter:blur(15px);
      
          border-bottom:1px solid rgba(0,255,136,0.3);
      
          box-shadow:
            0 0 25px rgba(0,255,136,0.08),
            0 0 50px rgba(0,195,255,0.06);
        }
      
        .menu{
          display:flex;
          justify-content:space-between;
          align-items:center;
          list-style:none;
        }
      
        /* LOGO */
        .logo{
          font-family:'Orbitron', sans-serif;
          font-size:34px;
          font-weight:700;
          letter-spacing:4px;
          text-transform:uppercase;
      
          color:var(--white);
      
          text-shadow:
            0 0 5px var(--neon-green),
            0 0 15px var(--neon-green),
            0 0 30px var(--neon-green);
      
          transition:0.4s;
          cursor:pointer;
        }
      
        .logo span{
          color:var(--neon-yellow);
      
          text-shadow:
            0 0 5px var(--neon-yellow),
            0 0 20px var(--neon-yellow);
        }
      
        .logo:hover{
          transform:scale(1.06);
        }
      
        /* MENU LINKS */
        .menu-itens{
          display:flex;
          gap:18px;
          list-style:none;
        }
      
        .menu-itens li a{
          position:relative;
          text-decoration:none;
      
          color:var(--white);
          font-size:15px;
          font-weight:500;
          letter-spacing:1px;
      
          padding:12px 22px;
          border-radius:12px;
      
          border:1px solid rgba(255,255,255,0.08);
      
          background:rgba(255,255,255,0.03);
      
          transition:0.35s ease;
      
          overflow:hidden;
        }
      
        .menu-itens li a::before{
          content:'';
          position:absolute;
          inset:0;
      
          background:linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.25),
            transparent
          );
      
          transform:translateX(-120%);
          transition:0.6s;
        }
      
        .menu-itens li a:hover::before{
          transform:translateX(120%);
        }
      
        .menu-itens li a:hover{
          border-color:var(--neon-green);
      
          color:var(--neon-green);
      
          box-shadow:
            0 0 12px rgba(0,255,136,0.5),
            0 0 30px rgba(0,255,136,0.2);
      
          transform:translateY(-3px);
        }
      
        /* HERO */
        .hero{
          min-height:100vh;
      
          display:flex;
          justify-content:center;
          align-items:center;
          flex-direction:column;
      
          text-align:center;
      
          padding:140px 20px 40px;
          position:relative;
        }
      
        .hero h1{
          font-family:'Orbitron', sans-serif;
      
          font-size:clamp(3rem, 8vw, 7rem);
          font-weight:700;
      
          line-height:1.1;
          text-transform:uppercase;
      
          margin-bottom:25px;
      
          background:linear-gradient(
            90deg,
            var(--neon-green),
            var(--neon-blue),
            var(--neon-yellow)
          );
      
          -webkit-background-clip:text;
          -webkit-text-fill-color:transparent;
      
          animation:glow 3s ease-in-out infinite alternate;
        }
      
        @keyframes glow{
          from{
            filter:drop-shadow(0 0 10px rgba(0,255,136,0.5));
          }
      
          to{
            filter:drop-shadow(0 0 25px rgba(0,195,255,0.9));
          }
        }
      
        .hero p{
          max-width:850px;
      
          color:#d9d9d9;
          font-size:1.2rem;
          line-height:1.9;
      
          margin-bottom:40px;
        }
      
        /* BOTÃO */
        .btn{
          position:relative;
      
          padding:16px 45px;
      
          border:none;
          border-radius:14px;
      
          background:linear-gradient(
            135deg,
            rgba(0,255,136,0.15),
            rgba(0,195,255,0.18)
          );
      
          border:1px solid rgba(0,255,136,0.4);
      
          color:var(--white);
      
          font-size:18px;
          font-weight:600;
          letter-spacing:1px;
      
          cursor:pointer;
      
          overflow:hidden;
      
          transition:0.4s ease;
      
          box-shadow:
            0 0 15px rgba(0,255,136,0.2),
            0 0 40px rgba(0,195,255,0.12);
        }
      
        .btn::before{
          content:'';
          position:absolute;
      
          top:0;
          left:-100%;
      
          width:100%;
          height:100%;
      
          background:linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.35),
            transparent
          );
      
          transition:0.7s;
        }
      
        .btn:hover::before{
          left:100%;
        }
      
        .btn:hover{
          transform:translateY(-5px) scale(1.03);
      
          border-color:var(--neon-blue);
      
          box-shadow:
            0 0 25px rgba(0,255,136,0.45),
            0 0 60px rgba(0,195,255,0.25);
        }
      
        /* CÍRCULOS FUTURISTAS */
        .circle{
          position:absolute;
          border-radius:50%;
          filter:blur(60px);
          z-index:-1;
        }
      
        .circle1{
          width:250px;
          height:250px;
      
          background:rgba(0,255,136,0.18);
      
          top:10%;
          left:5%;
      
          animation:float 8s ease-in-out infinite;
        }
      
        .circle2{
          width:300px;
          height:300px;
      
          background:rgba(0,195,255,0.18);
      
          bottom:5%;
          right:5%;
      
          animation:float 10s ease-in-out infinite;
        }
      
        @keyframes float{
          0%,100%{
            transform:translateY(0);
          }
      
          50%{
            transform:translateY(-25px);
          }
        }
      
        /* RESPONSIVO */
        @media(max-width:900px){
      
          nav{
            padding:20px 25px;
          }
      
          .menu{
            flex-direction:column;
            gap:20px;
          }
      
          .menu-itens{
            flex-wrap:wrap;
            justify-content:center;
          }
      
          .hero h1{
            font-size:3.5rem;
          }
      
          .hero p{
            font-size:1rem;
          }
        }
      
        @media(max-width:500px){
      
          .logo{
            font-size:26px;
          }
      
          .menu-itens li a{
            font-size:13px;
            padding:10px 16px;
          }
      
          .hero h1{
            font-size:2.4rem;
          }
      
          .btn{
            width:100%;
            max-width:280px;
          }
        }
      </style>
</head>
<body>
    <Div class="container">
      <header>
        <ul class="menu">
            <li class="logo">Copa<span>2026</span></li>
      
            <ul class="menu-itens">
              <li><a href="#">Início</a></li>
              <li><a href="#">Seleções</a></li>
              <li><a href="#">Jogos</a></li>
              <li><a href="#">Tabela</a></li>
              <li><a href="#">Ingressos</a></li>
            </ul>

      </header>
      <section>

      </section>
      <footer>
        <p>Felipe costa</p>
      </footer>
    </Div>
</body>
</html>
